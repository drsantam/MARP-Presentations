<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentations</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1f2a37;
    }
    .header {
      text-align: center;
      margin-bottom: 2em;
    }
    .header h1 {
      color: #0e4d7a;
      font-size: 2.2em;
      margin: 0;
      padding-bottom: 0.3em;
      border-bottom: 3px solid #c9a227;
      display: inline-block;
    }
    .header .subtitle {
      color: #5a6b7b;
      font-size: 0.9em;
      margin-top: 0.5em;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 1.2em 0;
      padding: 1em 1.5em;
      background: #f4f7fa;
      border-left: 4px solid #c9a227;
      border-radius: 6px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    li:hover {
      transform: translateX(4px);
      box-shadow: 0 2px 8px rgba(14, 77, 122, 0.1);
    }
    a {
      color: #0e4d7a;
      text-decoration: none;
      font-size: 1.3em;
      font-weight: 600;
    }
    a:hover {
      color: #0a3a5e;
    }
    .date {
      color: #5a6b7b;
      font-size: 0.75em;
      font-weight: 400;
      margin-top: 0.3em;
    }
    .footer {
      margin-top: 3em;
      text-align: center;
      color: #5a6b7b;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Presentations</h1>
  </div>
  <ul>
    <!--PRESENTATIONS-->
  </ul>
  <p class="footer">Built with Marp &middot; SGPGI Scholar theme</p>
</body>
</html>

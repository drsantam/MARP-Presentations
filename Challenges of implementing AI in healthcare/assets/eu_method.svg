at the defective</text><text x="0" y="145.66400000000002" font-family="Nunito, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">product was responsible for the damage</text><text x="0" y="167.264" font-family="Nunito, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">     </text></g></svg>
864" font-family="Nunito, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">   Patients become "owners" of data</text><text x="0" y="102.464" font-family="Nunito, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">   They can "opt-in" to data sharing</text><text x="0" y="124.064" font-family="Nunito, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">   Credentialed access to shared data</text><text x="0" y="145.66400000000002" font-family="Nunito, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">   Universal EHR interoperability </text></g><g stroke-linecap="round" transform="translate(770 16) rotate(0 169 140.5)"><path d="M32 0 C108 -1.98, 185.08 -2.53, 306 0 C328.69 1.83, 337.08 13.28, 338 32 C338.24 87.46, 337.21 142.76, 338 249 C339.62 266.94, 326.06 279.2, 306 281 C215.15 278.17, 131.17 278.8, 32 281 C12.83 280.08, 2.69 271.25, 0 249 C-1.74 161.75, -5.06 80.79, 0 32 C0.35 13.56, 9.98 -2.99, 32 0" stroke="none" stroke-width="0" fill="#a5d8ff"></path><path d="M32 0 C90.33 3.5, 151.58 2.38, 306 0 M32 0 C100.76 1.37, 169.26 1.95, 306 0 M306 0 C326.28 0.46, 336.63 12.29, 338 32 M306 0 C327.32 -0.76, 338.11 11.18, 338 32 M338 32 C336.85 101.51, 335.36 172.84, 338 249 M338 32 C340.44 112.19, 339.84 192.61, 338 249 M338 249 C336.55 270.12, 328.24 279.89, 306 281 M338 249 C340.12 269.21, 328.58 281.08, 306 281 M306 281 C246.25 281.22, 186.69 282.42, 32 281 M306 281 C221.14 282.57, 136.52 282.45, 32 281 M32 281 C11.59 280.73, -0.9 270, 0 249 M32 281 C12 280.19, 1.52 272.25, 0 249 M0 249 C-2.09 168.68, 0.08 86.9, 0 32 M0 249 C-1.49 182.14, -1.82 117.05, 0 32 M0 32 C-1.05 9.49, 10.08 -0.62, 32 0 M0 32 C0.03 10.49, 1